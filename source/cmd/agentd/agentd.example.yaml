listen: tcp://127.0.0.1:17654
token_env: ANVIL_AGENTD_TOKEN
# Starts with zero workers; add project workers via scheduler/web (sandbox FS).
max_workers: 0
overload: reject
cancel_grace_sec: 5
node_id: local-1
name: Local node
description: Desktop agentd for the local scheduler
# All project workers must live under this directory (web FS browser root).
sandbox_dir: C:/anvil-sandbox
cluster:
  # Set enabled: true and point url at anvil-scheduler listen_cluster.
  # Use the same token as ANVIL_SCHEDULER_TOKEN (token_env below).
  enabled: false
  url: tcp://127.0.0.1:17777
  node_id: local-1
  token_env: ANVIL_SCHEDULER_TOKEN
  heartbeat_sec: 10
plugins:
  available:
    - sample
    - memory
  deny: []
  search_paths: []
# Optional offline LLM (not needed when cluster-joined — scheduler provisions gateway URL/key).
# Model/provider are chosen in the app from the gateway catalog.
# llm:
#   base_url: http://127.0.0.1:8080/v1
#   api_key_env: ANVIL_API_KEY
