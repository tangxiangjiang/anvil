name: Local scheduler
description: Example scheduler for local fleet UI
listen_app: 127.0.0.1:17800
listen_cluster: tcp://127.0.0.1:17777
token_env: ANVIL_SCHEDULER_TOKEN
# Same path as anvil-web db_path so Flutter can login via web then call scheduler.
web_sessions_db: anvil-web.db
heartbeat_stale_sec: 30
models_cache_sec: 15
# Gateway credentials only. Model/provider are selected in the app
# (default = first entry from GET /v1/models).
# api_key is read from api_key_env at startup — never put secrets in this file.
llm:
  base_url: http://127.0.0.1:8080/v1
  api_key_env: ANVIL_GATEWAY_TOKEN
