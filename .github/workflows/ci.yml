# Tests the SDK and the VS Code extension on every push and pull request.
# Publishing to the Marketplace stays in vscode-marketplace.yml.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Test
        working-directory: source
        run: go test ./...

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: editors/vscode
        run: npm install

      - name: Test
        working-directory: editors/vscode
        run: npm test
